# Publishes the package to npm when a release tag (vx.y.z, made by `pnpm release`) is pushed.
# Uses npm trusted publishing (OIDC): no token is stored, and npm adds a provenance statement.
# One-time setup on npmjs.com: the package's Settings → Trusted publishing → GitHub Actions, with
# owner "Xerios", repository "design-system", workflow "publish.yml" and no environment.
name: Publish

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
      - run: pnpm build
      # Already built above, so the prepack script is skipped.
      - run: npm publish --ignore-scripts
