# Builds the kitchen sink (kitchensink/) with the README's screenshot (screenshot.png, of the demo page) and publishes
# them to GitHub Pages when a release tag (vx.y.z, made by `pnpm release`) is pushed, or when run by hand.
# One-time setup: the repository's Settings → Pages → Source must be "GitHub Actions", and Settings → Environments →
# github-pages must allow the tags `v*` to deploy (by default only the default branch can).
name: Pages

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - id: pages
        uses: actions/configure-pages@v6
      # The site's address turns on what only the published kitchen sink shows: the title's link, the npm and GitHub badges.
      - run: pnpm build:kitchensink
        env:
          VITE_PAGES_URL: ${{ steps.pages.outputs.base_url }}/
      # The README shows it from the site. The runner's Google Chrome takes it (scripts/screenshot.js finds it on the PATH).
      - run: pnpm screenshot --no-build
      - run: cp docs/screenshot.png kitchensink/dist/screenshot.png
      - uses: actions/upload-pages-artifact@v5
        with:
          path: kitchensink/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
